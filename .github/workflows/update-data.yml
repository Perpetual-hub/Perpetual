name: Update data

# Monthly, on the 1st: last month's deals from press releases, news and development lenders, plus refreshed
# PROFITS indicators. Opens a pull request so every change is reviewed before it
# goes live. Statistics (IRENA, EIA) update yearly and are refreshed by hand.
on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "How many months of press releases and news to look back (1 for the monthly run; never earlier than the three-year window)"
        default: "1"
      max_releases:
        description: "Most new articles to read in this run (caps the Claude API cost)"
        default: "300"
      model:
        description: "Claude model for extraction (claude-opus-5-5 or claude-haiku-5-5)"
        default: "claude-opus-5-5"
      sources:
        description: "Only read these sources, comma-separated (e.g. SolarQuarter,Asian Power,Eco-Business). Empty = all"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install openpyxl

      # Downloads and extractions are cached between runs, so each release is read and billed once.
      # The cache is saved by its own step straight after extraction, even if that step fails, so paid work is never lost.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Development lenders (IATI)
        run: python3 scripts/import-iati-deals.py .cache/iati

      - name: World Bank financings
        run: node scripts/fetch-worldbank-deals.mjs

      - name: Press releases
        run: python3 scripts/collect-deal-news.py .cache/candidates.json .cache/prn ${{ inputs.months || 1 }}

      - name: Energy news sites (Asia, Africa, Europe, Australia)
        run: |
          python3 scripts/collect-news-sitemaps.py .cache/news-candidates.json .cache/news-sitemaps ${{ inputs.months || 1 }}
          SOURCES="${{ inputs.sources }}" python3 -c "
          import json, os
          a = json.load(open('.cache/candidates.json'))
          b = json.load(open('.cache/news-candidates.json'))
          allc = sorted(a + b, key=lambda x: x.get('lastmod') or x.get('month') or '', reverse=True)
          # Deals are shown for three calendar years (e.g. 2024 to 2026), so older articles are never read or billed.
          import datetime
          start = f'{datetime.date.today().year - 2}-01'
          allc = [c for c in allc if (c.get('lastmod') or c.get('month') or '9999') >= start]
          want = {s.strip().lower() for s in os.environ.get('SOURCES', '').split(',') if s.strip()}
          if want:
              allc = [c for c in allc if (c.get('publisher') or 'PR Newswire').lower() in want]
          print(len(allc), 'candidates to read')
          json.dump(allc, open('.cache/all-candidates.json', 'w'))
          "

      - name: Extract deals from press releases and news
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          MAX_MINUTES: "280"
          MAX_RELEASES: ${{ inputs.max_releases || '300' }}
          EXTRACT_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
        run: node scripts/extract-deals.mjs .cache/all-candidates.json .cache/extract

      - name: Save the cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: data-cache-${{ github.run_id }}

      - name: Keep a copy of the new data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 30

      - name: PROFITS indicator scores
        run: node scripts/build-profits.mjs

      - name: Check the site still builds
        run: npm run lint && npm run typecheck && npm run build

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then echo "No data changes."; exit 0; fi
          branch="data-update/$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "perpetual-data-bot"
          git config user.email "perpetual-data-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --title "Data update $(date -u +%Y-%m-%d)" --body "Automated data refresh: new deals and indicators. Review the diff before merging." \
            || echo "::warning::Could not open a pull request (allow it under Settings, Actions, General). The changes are on branch $branch."
