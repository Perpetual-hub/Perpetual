name: Prune old data

# Daily: deletes deals dated more than five years ago from the data files and commits the change
# to main. The commit triggers a new Vercel build, which also moves the five-year window forward.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prune-old-data.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- data; then echo "Nothing to prune."; exit 0; fi
          git config user.name "perpetual-data-bot"
          git config user.email "perpetual-data-bot@users.noreply.github.com"
          git add data
          git commit -m "Prune deals older than five years"
          git push
